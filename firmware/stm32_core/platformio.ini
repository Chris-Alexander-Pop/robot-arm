; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F401CC]
platform = ststm32
board = genericSTM32F401CC
framework = arduino
build_src_filter =
    +<*>
    -<native_test_app.cpp>

; Add any libraries you need here, e.g., for the AS5600 encoder or AccelStepper
lib_deps =
    waspinator/AccelStepper @ ^1.64
    robtillaart/AS5600 @ ^0.4.0

; Configure the upload method (ST-Link is common for STM32)
upload_protocol = stlink

monitor_speed = 115200
build_flags =
    -Iinclude

[env:native]
platform = native
test_build_src = no
build_src_filter =
    -<main.cpp>
    +<native_test_app.cpp>
build_flags =
    -Iinclude

[env:genericSTM32F401CC_renode]
platform = ststm32
board = genericSTM32F401CC
framework = arduino
build_src_filter =
    +<*>
    -<native_test_app.cpp>
lib_deps =
    waspinator/AccelStepper @ ^1.64
    robtillaart/AS5600 @ ^0.4.0
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -DROBOT_ARM_RENODE
    -Iinclude
