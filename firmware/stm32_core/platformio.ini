; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Scan lib/ headers transitively so cross-lib dependencies (e.g. joint_controller.h
; including stepper_driver.h) are resolved without manual include-path flags.
[env]
lib_ldf_mode = chain+
lib_extra_dirs = ../lib

[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino
build_src_filter =
    +<*>
    -<native_test_app.cpp>
    -<hardware_test_main.cpp>
build_flags =
    -I${PROJECT_DIR}/src

; AccelStepper generates STEP/DIR for CL57T / CL42T closed-loop stepper drivers.
; StepperDriver (MIT) is used by hwtest_stepper_* helpers.
; The CL57T and CL42T handle encoder feedback internally — STM32 only sends STEP/DIR.
lib_deps =
    waspinator/AccelStepper @ ^1.64
    laurb9/StepperDriver @ ^1.1.2

upload_protocol = stlink
monitor_speed = 115200

[env:native]
platform = native
; The `drivers` lib includes Arduino-only headers under `#ifdef ARDUINO`, but LDF
; still tags it as incompatible with `native` unless compatibility checks are off.
lib_compat_mode = off
test_build_src = no
build_src_filter =
    -<main.cpp>
    +<native_test_app.cpp>

[env:nucleo_f401re_renode]
platform = ststm32
board = nucleo_f401re
framework = arduino
build_src_filter =
    +<*>
    -<native_test_app.cpp>
    -<hardware_test_main.cpp>
lib_deps =
    waspinator/AccelStepper @ ^1.64
    laurb9/StepperDriver @ ^1.1.2
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -DROBOT_ARM_RENODE
    -I${PROJECT_DIR}/src

; Hardware test environment.
; Builds hardware_test_main.cpp (and the hwtest_* modules it includes).
; Select the test to run by passing a -DHWTEST_* flag via the
; PLATFORMIO_BUILD_FLAGS environment variable before calling pio run.
; See firmware/scripts/hardware_tests/ for convenience shell scripts.
;
; Example (manual):
;   cd firmware/stm32_core
;   PLATFORMIO_BUILD_FLAGS="-DHWTEST_STEPPER_SINGLE" pio run -e nucleo_f401re_hwtest -t upload
[env:nucleo_f401re_hwtest]
platform = ststm32
board = nucleo_f401re
framework = arduino
build_src_filter =
    -<*>
    +<hardware_test_main.cpp>
build_flags =
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/../scripts/hardware_tests
; AccelStepper / StepperDriver only needed for hwtest_stepper_* ; CL57T bench uses direct GPIO.
lib_deps =
    waspinator/AccelStepper @ ^1.64
    laurb9/StepperDriver @ ^1.1.2
upload_protocol = stlink
monitor_speed = 115200
