; ESP32 joint-node firmware (one binary, node ID from build flag or NVS).
; Open this folder as the PlatformIO project root in VS Code.
;
; Default module: ESP32-WROOM-32 devkit (adjust board if you use C3/S3 mini boards).
; Flash a specific joint:
;   pio run -e node_j3 -t upload
; Flash gripper node:
;   pio run -e node_gripper -t upload
;
; Override node ID at runtime (same firmware image):
;   pio run -e esp32dev -t upload
;   pio device monitor   # then: NODE_ID 4

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
lib_extra_dirs = ../lib
build_flags =
    -I${PROJECT_DIR}/src
    -DROBOT_ARM_BUS_BAUD=921600
    -DROBOT_ARM_FIRMWARE_VERSION=0x0001

lib_deps =
    laurb9/StepperDriver @ ^1.1.2

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=0

; Per-node environments bake the address for production flashing.
; All extend the same sources — only ROBOT_ARM_NODE_ID changes.

[env:node_j1]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=1

[env:node_j2]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=2

[env:node_j3]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=3

[env:node_j4]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=4

[env:node_j5]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=5

[env:node_j6]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=6

[env:node_gripper]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=7
