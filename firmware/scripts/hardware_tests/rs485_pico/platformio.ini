; RS-485 multi-node bench test — Raspberry Pi Pico master.
;
; Sends addressed "@N PING\r\n" frames on the RS-485 bus and reports
; replies on the USB serial monitor.
;
; Flash:
;   pio run -e pico -t upload
;
; Monitor:
;   pio device monitor -e pico   (115200)
;
; Or use the helper script:
;   ../run_rs485_pico.sh

[platformio]
default_envs = pico

[env:pico]
platform  = raspberrypi
board     = pico
framework = arduino

monitor_speed = 115200

build_flags =
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/../
