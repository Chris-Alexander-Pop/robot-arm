; Arduino Hall sensor bench test (A3144-style, digital).
;
;   pio run -e uno -t upload && pio device monitor
;   ../run_hall_arduino.sh uno

[platformio]
default_envs = uno

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200

[env:uno]
board = uno

[env:nano]
board = nanoatmega328

[env:mega]
board = megaatmega2560
