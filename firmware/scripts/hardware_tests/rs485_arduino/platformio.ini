; Arduino RS-485 echo — bus partner for Nucleo HWTEST_RS485.
;
;   pio run -e uno -t upload && pio device monitor
;   ../run_rs485_arduino.sh uno
;
; Uno/Nano use AltSoftSerial (hardware-timed) on pins 8/9 — not SoftwareSerial.

[platformio]
default_envs = uno

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}/../
lib_deps =
    paulstoffregen/AltSoftSerial @ ^1.4

[env:uno]
board = uno

[env:nano]
board = nanoatmega328

[env:mega]
board = megaatmega2560
build_flags =
    -I${PROJECT_DIR}/../
lib_deps =
