; RS-485 multi-node bench — ESP32-C3 slave nodes.
;
; One firmware image, five build envs (node_1..node_5) that bake
; ROBOT_ARM_NODE_ID into the binary at compile time.
;
; Flash a specific node (plug that node's USB, then):
;   pio run -e node_1 -t upload   # repeat for node_2..node_5
;
; Monitor (USB CDC on ESP32-C3 native USB):
;   pio device monitor -e node_1
;
; Override node ID at runtime via serial command:
;   NODE_ID 3        (saves to NVS; survives reboots)
;
; WiFi credentials must be set in src/wifi_config.h (copy from the template).
; Or override at build time:
;   pio run -e node_1 --build-flags "-DWIFI_SSID=\"MyNet\" -DWIFI_PASS=\"secret\""

[platformio]
; Default to node_1 for quick iteration. Use -e node_N to build a specific node,
; or pass all five explicitly: pio run -e node_1 -e node_2 -e node_3 -e node_4 -e node_5
default_envs = node_1

[env]
platform     = espressif32
board        = lolin_c3_mini
framework    = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Include the shared bench headers from the parent hardware_tests directory.
build_flags =
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/../
    -DLOG_UDP_PORT=9000

lib_ldf_mode = chain

; Per-node environments — only ROBOT_ARM_NODE_ID changes.

[env:node_1]
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=1

[env:node_2]
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=2

[env:node_3]
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=3

[env:node_4]
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=4

[env:node_5]
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=5
