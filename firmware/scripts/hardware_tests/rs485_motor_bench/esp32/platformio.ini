; RS-485 motor bench — ESP32-C3 slave nodes (nodes 1–4).
;
; Flash a specific node:
;   pio run -e node_1 -t upload
;
; WiFi credentials: copy src/wifi_config.h.example to src/wifi_config.h

[platformio]
default_envs = node_1

[env]
platform      = espressif32
board         = lolin_c3_mini
framework     = arduino
monitor_speed = 115200
monitor_rts   = 0
monitor_dtr   = 0

build_flags =
    -I${PROJECT_DIR}/src
    -I${PROJECT_DIR}/../
    -I${PROJECT_DIR}/../../
    -DLOG_UDP_PORT=9000

lib_ldf_mode = chain

[env:node_1]
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=1
    -DROBOT_ARM_MAX_STEP_HZ=3000

[env:node_2]
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=2
    -DROBOT_ARM_MAX_STEP_HZ=3000

[env:node_3]
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=3
    -DROBOT_ARM_MAX_STEP_HZ=2000

[env:node_4]
build_flags =
    ${env.build_flags}
    -DROBOT_ARM_NODE_ID=4
    -DROBOT_ARM_MAX_STEP_HZ=2000
