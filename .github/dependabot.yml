version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /simulation
    schedule:
      interval: monthly
    # Keep simulation installable on CI's Python 3.11 floor.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.5"]
      - dependency-name: "contourpy"
        versions: [">=1.4"]
