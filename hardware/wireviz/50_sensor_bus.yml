# 50_sensor_bus
#
# What lives on this harness:
#   - Six A3144 Hall-effect HOME sensors (one per joint, used at startup)
#   - Optional AS5600 magnetic encoders for J5 / J6 only (Phase 2)
#
# What is NOT on this harness:
#   - J1..J4 do NOT use AS5600. The CL57T (J1/J2) and CL42T (J3/J4) closed-loop
#     kits include a factory motor encoder that the driver reads internally;
#     no external encoder, magnet, or I2C path is required for those joints.
#   - The TCA9548A multiplexer is only fitted if BOTH J5 and J6 get an AS5600
#     (because both AS5600 boards share the fixed I2C address 0x36). With one
#     or zero wrist encoders, the mux is unnecessary.
#
# Sources:
#   docs/Constraints.md sec 2c
#   docs/implementation/electrical_design.md sec 4
#   docs/implementation/electrical_interface_map.md sec 2b

connectors:
  MCU:
    type: STM32 Nucleo-F401RE
    subtype: I2C1 + 6 home interrupt inputs
    pinlabels:
      - PB6        # I2C1 SCL (only used if any AS5600 is fitted)
      - PB7        # I2C1 SDA
      - GND_L
      - P5V_LOGIC  # Hall sensor supply
      - HOME_J1
      - HOME_J2
      - HOME_J3
      - HOME_J4
      - HOME_J5
      - HOME_J6

  MUX:
    type: TI TCA9548A
    subtype: I2C mux - OPTIONAL, only if both J5 and J6 get AS5600
    pinlabels:
      - VCC
      - GND_L
      - SCL_in
      - SDA_in
      - SC4   # channel 4 SCL - to AS5600 J5
      - SD4
      - SC5   # channel 5 SCL - to AS5600 J6
      - SD5
    notes: With only one wrist AS5600, skip the mux and wire that AS5600 directly to PB6/PB7.

  AS5600_J5:
    type: AS5600 board (OPTIONAL, J5 only)
    subtype: Phase 2 add-on if open-loop drift is unacceptable
    pinlabels: [VCC, GND, SCL, SDA, DIR, OUT]
    notes: Skip entirely unless wrist precision becomes a measured problem.
  AS5600_J6:
    type: AS5600 board (OPTIONAL, J6 only)
    subtype: Phase 2 add-on if open-loop drift is unacceptable
    pinlabels: [VCC, GND, SCL, SDA, DIR, OUT]

  HALL_J1:
    type: Allegro A3144 Hall (J1 home)
    pinlabels: [VCC, GND, OUT]
  HALL_J2:
    type: Allegro A3144 Hall (J2 home)
    pinlabels: [VCC, GND, OUT]
  HALL_J3:
    type: Allegro A3144 Hall (J3 home)
    pinlabels: [VCC, GND, OUT]
  HALL_J4:
    type: Allegro A3144 Hall (J4 home)
    pinlabels: [VCC, GND, OUT]
  HALL_J5:
    type: Allegro A3144 Hall (J5 home)
    pinlabels: [VCC, GND, OUT]
  HALL_J6:
    type: Allegro A3144 Hall (J6 home)
    pinlabels: [VCC, GND, OUT]

cables:
  W_MUX_BUS:
    category: bundle
    wirelabels: [SCL, SDA, P5V_LOGIC, GND_L]
    gauge: 24 AWG
    colors: [YE, GN, RD, BK]
    shield: true
    length: 0.1
    notes: Only present if the optional mux is fitted. I2C 4.7k pullups live on the controller board.

  W_ENC_J5:
    category: bundle
    wirelabels: [VCC, GND, SCL, SDA]
    gauge: 26 AWG
    colors: [RD, BK, YE, GN]
    shield: true
    length: 1.5
    notes: Only present if AS5600 is fitted on J5.
  W_ENC_J6:
    category: bundle
    wirelabels: [VCC, GND, SCL, SDA]
    gauge: 26 AWG
    colors: [RD, BK, YE, GN]
    shield: true
    length: 1.5
    notes: Only present if AS5600 is fitted on J6.

  W_HOME_J1:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 1.0
  W_HOME_J2:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 1.0
  W_HOME_J3:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 1.0
  W_HOME_J4:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 1.0
  W_HOME_J5:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 1.0
  W_HOME_J6:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 1.0

connections:
  # Optional I2C path - only wired if the corresponding AS5600 is fitted.
  - [MCU: [PB6, PB7, P5V_LOGIC, GND_L], W_MUX_BUS: [1-4], MUX: [SCL_in, SDA_in, VCC, GND_L]]
  - [MUX: [SC4, SD4], W_ENC_J5: [3, 4], AS5600_J5: [SCL, SDA]]
  - [MUX: [VCC, GND_L], W_ENC_J5: [1, 2], AS5600_J5: [VCC, GND]]
  - [MUX: [SC5, SD5], W_ENC_J6: [3, 4], AS5600_J6: [SCL, SDA]]
  - [MUX: [VCC, GND_L], W_ENC_J6: [1, 2], AS5600_J6: [VCC, GND]]

  # Six Hall HOME inputs - always populated, one per joint.
  - [MCU: [P5V_LOGIC, GND_L, HOME_J1], W_HOME_J1: [1-3], HALL_J1: [VCC, GND, OUT]]
  - [MCU: [P5V_LOGIC, GND_L, HOME_J2], W_HOME_J2: [1-3], HALL_J2: [VCC, GND, OUT]]
  - [MCU: [P5V_LOGIC, GND_L, HOME_J3], W_HOME_J3: [1-3], HALL_J3: [VCC, GND, OUT]]
  - [MCU: [P5V_LOGIC, GND_L, HOME_J4], W_HOME_J4: [1-3], HALL_J4: [VCC, GND, OUT]]
  - [MCU: [P5V_LOGIC, GND_L, HOME_J5], W_HOME_J5: [1-3], HALL_J5: [VCC, GND, OUT]]
  - [MCU: [P5V_LOGIC, GND_L, HOME_J6], W_HOME_J6: [1-3], HALL_J6: [VCC, GND, OUT]]
