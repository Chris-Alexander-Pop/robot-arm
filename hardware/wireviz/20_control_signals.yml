# 20_control_signals
# STM32 Nucleo-F401RE -> 74HC245 -> six driver control headers; Pi UART.
# Single MCU connector kept here — splitting it increased diagram height.

connectors:
  MCU:
    type: STM32 Nucleo-F401RE
    subtype: STM32F401RET6
    pinlabels:
      - P5V_IN
      - GND_L
      - PB0
      - PB1
      - PB10
      - PB11
      - PB12
      - PB13
      - PB14
      - PB15
      - PC6
      - PC7
      - PC8
      - PC9
      - PA9
      - PA10
      - PB6
      - PB7
    notes: Pin map per firmware/pinout.md. ENABLE and ALARM routing still TBD on some joints.

  HC245:
    type: 74HC245
    subtype: 3.3V to 5V octal transceiver
    pinlabels:
      - P5V_LOGIC
      - GND_L
      - DIR
      - OE_n
      - A1
      - A2
      - A3
      - A4
      - B1
      - B2
      - B3
      - B4

  CTRL_J1:
    type: 6-pin control header
    pinlabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
  CTRL_J2:
    type: 6-pin control header
    pinlabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
  CTRL_J3:
    type: 6-pin control header
    pinlabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
  CTRL_J4:
    type: 6-pin control header
    pinlabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
  CTRL_J5:
    type: 6-pin control header
    pinlabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
  CTRL_J6:
    type: 6-pin control header
    pinlabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]

  PI:
    type: Raspberry Pi 4
    subtype: UART to STM32
    pinlabels: [GPIO14_TX, GPIO15_RX, GND_L]

cables:
  W_MCU_TO_245_J12:
    category: bundle
    wirelabels: [STEP_J1, DIR_J1, ENABLE_J1, STEP_J2, DIR_J2, ENABLE_J2]
    gauge: 24 AWG
    colors: [WH, YE, GN, OG, BU, VT]
    length: 0.05

  W_CTRL_J1:
    category: bundle
    wirelabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
    gauge: 22 AWG
    colors: [WH, YE, GN, OG, BK, RD]
    shield: true
    length: 1.0
  W_CTRL_J2:
    category: bundle
    wirelabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
    gauge: 22 AWG
    colors: [WH, YE, GN, OG, BK, RD]
    shield: true
    length: 1.0
  W_CTRL_J3:
    category: bundle
    wirelabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
    gauge: 22 AWG
    colors: [WH, YE, GN, OG, BK, RD]
    shield: true
    length: 1.0
  W_CTRL_J4:
    category: bundle
    wirelabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
    gauge: 22 AWG
    colors: [WH, YE, GN, OG, BK, RD]
    shield: true
    length: 1.0
  W_CTRL_J5:
    category: bundle
    wirelabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
    gauge: 22 AWG
    colors: [WH, YE, GN, OG, BK, RD]
    shield: true
    length: 1.2
  W_CTRL_J6:
    category: bundle
    wirelabels: [STEP, DIR, ENABLE, ALARM, GND_L, P5V_REF]
    gauge: 22 AWG
    colors: [WH, YE, GN, OG, BK, RD]
    shield: true
    length: 1.2

  W_PI:
    category: bundle
    wirelabels: [TX_to_RX, RX_from_TX, GND_L]
    gauge: 24 AWG
    colors: [WH, GY, BK]
    length: 0.3

connections:
  - [MCU: [PB0, PB1], W_MCU_TO_245_J12: [1, 2], HC245: [A1, A2]]
  - [MCU: [PB10, PB11], W_MCU_TO_245_J12: [4, 5], HC245: [A3, A4]]

  - [HC245: [B1, B2, B3], W_CTRL_J1: [1-3], CTRL_J1: [STEP, DIR, ENABLE]]
  - [HC245: [B4], W_CTRL_J2: [1], CTRL_J2: [STEP]]

  - [MCU: [GND_L], W_CTRL_J1: [5], CTRL_J1: [GND_L]]
  - [MCU: [P5V_IN], W_CTRL_J1: [6], CTRL_J1: [P5V_REF]]
  - [MCU: [PB13], W_CTRL_J1: [4], CTRL_J1: [ALARM]]

  - [MCU: [GND_L], W_CTRL_J2: [5], CTRL_J2: [GND_L]]
  - [MCU: [P5V_IN], W_CTRL_J2: [6], CTRL_J2: [P5V_REF]]
  - [MCU: [PB14], W_CTRL_J2: [4], CTRL_J2: [ALARM]]

  - [MCU: [PB12, PB13], W_CTRL_J3: [1-2], CTRL_J3: [STEP, DIR]]
  - [MCU: [GND_L, P5V_IN], W_CTRL_J3: [5-6], CTRL_J3: [GND_L, P5V_REF]]

  - [MCU: [PB14, PB15], W_CTRL_J4: [1-2], CTRL_J4: [STEP, DIR]]
  - [MCU: [GND_L, P5V_IN], W_CTRL_J4: [5-6], CTRL_J4: [GND_L, P5V_REF]]

  - [MCU: [PC6, PC7], W_CTRL_J5: [1-2], CTRL_J5: [STEP, DIR]]
  - [MCU: [GND_L, P5V_IN], W_CTRL_J5: [5-6], CTRL_J5: [GND_L, P5V_REF]]

  - [MCU: [PC8, PC9], W_CTRL_J6: [1-2], CTRL_J6: [STEP, DIR]]
  - [MCU: [GND_L, P5V_IN], W_CTRL_J6: [5-6], CTRL_J6: [GND_L, P5V_REF]]

  - [MCU: [PA9, PA10, GND_L], W_PI: [1-3], PI: [GPIO15_RX, GPIO14_TX, GND_L]]
