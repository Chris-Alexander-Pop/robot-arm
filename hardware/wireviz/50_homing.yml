# 50_homing — six A3144 Hall HOME sensors (one per joint, boot-time reference).
# Production: each sensor wires to the ESP32 joint node on that link (not the base Nucleo).
# Legacy centralized bench: same sensor harness can terminate at the Nucleo instead.
# See docs/implementation/distributed_bus_architecture.md § Homing.

connectors:
  NODE_J1:
    type: ESP32 joint node (J1)
    subtype: HOME GPIO + local P5V from node buck
    pinlabels: [GND_L, P5V_LOGIC, HOME]
  NODE_J2:
    type: ESP32 joint node (J2)
    pinlabels: [GND_L, P5V_LOGIC, HOME]
  NODE_J3:
    type: ESP32 joint node (J3)
    pinlabels: [GND_L, P5V_LOGIC, HOME]
  NODE_J4:
    type: ESP32 joint node (J4)
    pinlabels: [GND_L, P5V_LOGIC, HOME]
  NODE_J5:
    type: ESP32 joint node (J5)
    pinlabels: [GND_L, P5V_LOGIC, HOME]
  NODE_J6:
    type: ESP32 joint node (J6)
    pinlabels: [GND_L, P5V_LOGIC, HOME]

  HALL_J1:
    type: Allegro A3144 Hall (J1 home)
    pinlabels: [VCC, GND, OUT]
  HALL_J2:
    type: Allegro A3144 Hall (J2 home)
    pinlabels: [VCC, GND, OUT]
  HALL_J3:
    type: Allegro A3144 Hall (J3 home)
    pinlabels: [VCC, GND, OUT]
  HALL_J4:
    type: Allegro A3144 Hall (J4 home)
    pinlabels: [VCC, GND, OUT]
  HALL_J5:
    type: Allegro A3144 Hall (J5 home)
    pinlabels: [VCC, GND, OUT]
  HALL_J6:
    type: Allegro A3144 Hall (J6 home)
    pinlabels: [VCC, GND, OUT]

cables:
  W_HOME_J1:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 0.3
  W_HOME_J2:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 0.3
  W_HOME_J3:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 0.3
  W_HOME_J4:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 0.3
  W_HOME_J5:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 0.3
  W_HOME_J6:
    category: bundle
    wirelabels: [VCC, GND, OUT]
    gauge: 24 AWG
    colors: [RD, BK, WH]
    shield: true
    length: 0.3

connections:
  - [NODE_J1: [P5V_LOGIC, GND_L, HOME], W_HOME_J1: [1-3], HALL_J1: [VCC, GND, OUT]]
  - [NODE_J2: [P5V_LOGIC, GND_L, HOME], W_HOME_J2: [1-3], HALL_J2: [VCC, GND, OUT]]
  - [NODE_J3: [P5V_LOGIC, GND_L, HOME], W_HOME_J3: [1-3], HALL_J3: [VCC, GND, OUT]]
  - [NODE_J4: [P5V_LOGIC, GND_L, HOME], W_HOME_J4: [1-3], HALL_J4: [VCC, GND, OUT]]
  - [NODE_J5: [P5V_LOGIC, GND_L, HOME], W_HOME_J5: [1-3], HALL_J5: [VCC, GND, OUT]]
  - [NODE_J6: [P5V_LOGIC, GND_L, HOME], W_HOME_J6: [1-3], HALL_J6: [VCC, GND, OUT]]
